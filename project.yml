name: FlyMate
options:
  bundleIdPrefix: com.flymate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  Core:
    path: Packages/Core
  Domain:
    path: Packages/Domain
  Data:
    path: Packages/Data
  Presentation:
    path: Packages/Presentation

targets:
  FlyMate:
    type: application
    platform: iOS
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: FlyMate
    resources:
      - path: Resources
    entitlements:
      path: FlyMate/FlyMate.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: FlyMate/Info.plist
      properties:
        CFBundleDisplayName: FlyMate
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        KAKAO_APP_KEY: $(KAKAO_APP_KEY)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - kakao$(KAKAO_APP_KEY)
        LSApplicationQueriesSchemes:
          - kakaokompassauth
          - storykompassauth
          - kakaolink
    dependencies:
      - package: Core
      - package: Domain
      - package: Data
      - package: Presentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flymate.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: true

  FlyMateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlyMateTests
    dependencies:
      - target: FlyMate
      - package: Presentation
        product: Presentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flymate.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FlyMate.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FlyMate"
        GENERATE_INFOPLIST_FILE: true

schemes:
  FlyMate:
    build:
      targets:
        FlyMate: all
        FlyMateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlyMateTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
