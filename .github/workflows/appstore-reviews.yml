name: Sync App Store Reviews

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviews & create issues
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # 리포에 등록된 키 시크릿은 base64 인코딩된 ASC_KEY_P8 뿐이다.
          # appstore-submit.yml 과 같은 방식으로 디코드해 넘긴다.
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: "6801114073" # 공개 App Store ID — 시크릿 아님
          GH_TOKEN: ${{ github.token }}
        run: |
          export ASC_PRIVATE_KEY="$(echo "$ASC_KEY_P8_B64" | base64 -d)"
          node scripts/sync-appstore-reviews.mjs
