# 인스타그램 해시태그 모니터링 — 6시간마다 새 게시글 링크를 메일로 알림
#
# 사전 준비 (최초 1회):
# 1. 인스타그램 홍보 계정을 프로페셔널(비즈니스/크리에이터) 계정으로 전환
# 2. Facebook 페이지 생성 후 인스타그램 계정과 연결
# 3. developers.facebook.com 에서 앱 생성 → Instagram Graph API 추가
# 4. Graph API Explorer에서 instagram_basic, pages_show_list 권한으로 토큰 발급
#    → 장기(60일) 토큰으로 교환 후 IG_ACCESS_TOKEN 시크릿에 등록 (60일마다 갱신 필요)
# 5. /me/accounts → 페이지의 instagram_business_account.id 를 IG_USER_ID 시크릿에 등록
# 6. Gmail 앱 비밀번호 발급 (myaccount.google.com/apppasswords) → GMAIL_APP_PASSWORD 시크릿에 등록
name: Instagram Hashtag Alerts

on:
  # 스케줄 중단 (2026-09-16) — 위 사전 준비 4~6번이 미완이라 IG_USER_ID·IG_ACCESS_TOKEN·
  # GMAIL_APP_PASSWORD 시크릿이 셋 다 없고, 6시간마다 'missing env' 로 실패만 쌓였다.
  # 시크릿을 등록한 뒤 아래 두 줄의 주석을 풀 것.
  # schedule:
  #   - cron: "0 */6 * * *" # 6시간 간격 (00/06/12/18 UTC = 09/15/21/03 KST)
  workflow_dispatch:

jobs:
  check-hashtags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install nodemailer --no-save
      - name: Check hashtags & send email
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/sync-instagram-hashtags.mjs
